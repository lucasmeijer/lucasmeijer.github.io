<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>atelier — made for humans</title>
  <link rel="canonical" href="https://lucasmeijer.com/atelier/" />
  <meta name="description" content="atelier — made for humans" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://lucasmeijer.com/atelier/" />
  <meta property="og:title" content="atelier — made for humans" />
  <meta property="og:description" content="atelier — made for humans" />
  <meta property="og:image" content="https://lucasmeijer.com/atelier/social-card.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="atelier — made for humans" />
  <meta name="twitter:description" content="atelier — made for humans" />
  <meta name="twitter:image" content="https://lucasmeijer.com/atelier/social-card.png" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <img class="logo" src="logo.png" alt="atelier — made for humans" />

  <!-- video -->
  <div class="video">
    <iframe
      src="https://www.youtube-nocookie.com/embed/uHCZ4CAjviA?rel=0&modestbranding=1&playsinline=1"
      title="Introducing Atelier"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen></iframe>
  </div>

  <!-- waitlist signup -->
  <div class="waitlist">
    <p class="hint">Sign up for the waitlist.</p>
    <form id="waitlist-form" class="signup"
          action="https://api.web3forms.com/submit" method="POST">
      <input type="hidden" name="access_key" value="f2a351b6-14b2-4641-b5fd-ffd2afa015d2" />
      <input type="hidden" name="subject" value="New atelier waitlist signup" />
      <input type="checkbox" name="botcheck" class="hidden" style="display:none" />
      <input type="email" name="email" id="email" required
             placeholder="you@example.com" autocomplete="email" />
      <button type="submit" class="submit">Join</button>
    </form>
    <p class="signup-msg" id="signup-msg" hidden></p>
  </div>


  <script>
    const form = document.getElementById('waitlist-form');
    const msg = document.getElementById('signup-msg');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = form.querySelector('.submit');
      if (!form.email.value) return;
      btn.disabled = true;
      btn.textContent = '...';
      try {
        const res = await fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: { 'Accept': 'application/json' },
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.message || 'failed');
        form.hidden = true;
        msg.textContent = "You're on the list! I'll be in touch, thanks for your interest!";
        msg.classList.add('ok');
        msg.hidden = false;
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Join';
        msg.textContent = 'Something went wrong \u2014 please try again.';
        msg.classList.add('err');
        msg.hidden = false;
      }
    });
  </script>
</body>
</html>
