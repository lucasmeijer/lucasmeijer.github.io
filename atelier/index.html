<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>atelier — made for humans</title>
  <link rel="canonical" href="https://lucasmeijer.com/atelier/" />
  <meta name="description" content="atelier — made for humans" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://lucasmeijer.com/atelier/" />
  <meta property="og:title" content="atelier — made for humans" />
  <meta property="og:description" content="atelier — made for humans" />
  <meta property="og:image" content="https://lucasmeijer.com/atelier/social-card.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="atelier — made for humans" />
  <meta name="twitter:description" content="atelier — made for humans" />
  <meta name="twitter:image" content="https://lucasmeijer.com/atelier/social-card.png" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <img class="logo" src="logo.png" alt="atelier — made for humans" />

  <!-- video -->
  <div class="video">
    <iframe
      src="https://www.youtube-nocookie.com/embed/uHCZ4CAjviA?rel=0&modestbranding=1&playsinline=1&cc_load_policy=0&iv_load_policy=3"
      title="Introducing Atelier"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen></iframe>
  </div>

  <!-- installation -->
  <section class="install" aria-label="Atelier installation instructions">
    <ol class="steps">
      <li class="step">
        <span class="step-number" aria-hidden="true">1</span>
        <div class="step-content">
          <h2>Connect to your server</h2>
          <p>SSH into a Linux server that will only be used for Atelier.</p>
        </div>
      </li>
      <li class="step">
        <span class="step-number" aria-hidden="true">2</span>
        <div class="step-content">
          <h2>Install Tailscale</h2>
          <div class="command">
            <code id="tailscale-command">curl -fsSL https://tailscale.com/install.sh | sh</code>
            <button class="copy" type="button" aria-label="Copy Tailscale install command" data-copy-target="tailscale-command">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="11" height="11" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg>
              <span>Copy</span>
            </button>
          </div>
        </div>
      </li>
      <li class="step">
        <span class="step-number" aria-hidden="true">3</span>
        <div class="step-content">
          <h2>Install Atelier</h2>
          <div class="command">
            <code id="atelier-command">curl -fsSL https://lucasmeijer.com/get-atelier | sudo bash</code>
            <button class="copy" type="button" aria-label="Copy Atelier install command" data-copy-target="atelier-command">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="11" height="11" rx="2"></rect><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"></path></svg>
              <span>Copy</span>
            </button>
          </div>
        </div>
      </li>
    </ol>
  </section>

  <script>
    document.querySelectorAll('.copy').forEach((copyButton) => {
      copyButton.addEventListener('click', async () => {
        const source = document.getElementById(copyButton.dataset.copyTarget);
        try {
          await navigator.clipboard.writeText(source.textContent);
          copyButton.classList.add('copied');
          copyButton.querySelector('span').textContent = 'Copied';
          setTimeout(() => {
            copyButton.classList.remove('copied');
            copyButton.querySelector('span').textContent = 'Copy';
          }, 1800);
        } catch (_) {
          window.getSelection().selectAllChildren(source);
        }
      });
    });
  </script>
</body>
</html>
